<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好傢在年終慶 | 抽獎系統</title>
    <style>
        :root { --red: #D32F2F; --dark-red: #8B0000; --gold: #FFD700; --light-gold: #FFF9C4; --white: #FFFFFF; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: radial-gradient(circle at center, #b71c1c 0%, #310000 100%); margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        
        .container { width: 100%; max-width: 400px; background: var(--white); border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); overflow: hidden; border: 4px solid var(--gold); display: flex; flex-direction: column; position: relative; }
        .header { background: var(--dark-red); color: var(--gold); padding: 12px; text-align: center; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }

        .prize-board { 
            background: linear-gradient(135deg, #d32f2f 0%, #8b0000 100%); 
            color: var(--gold); 
            padding: 10px; 
            margin: 10px 15px 0; 
            border-radius: 15px; 
            border: 2px solid var(--gold); 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .board-title { grid-column: span 2; text-align: center; font-weight: bold; font-size: 13px; border-bottom: 1px dashed rgba(255, 215, 0, 0.4); padding-bottom: 4px; }
        .board-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: rgba(255, 255, 255, 0.1); border-radius: 6px; }
        .board-label { font-size: 12px; font-weight: bold; }
        .board-qty { font-weight: 900; font-size: 16px; color: #FFF; }
        
        .admin-zone { background: var(--light-gold); padding: 10px; margin: 10px; border-radius: 12px; border: 1px solid #e0c060; flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        
        input[type="password"] { font-family: password; letter-spacing: 2px; }
        select, input { border: 2px solid #ccc; border-radius: 8px; padding: 10px; font-size: 14px; outline: none; background: white; box-sizing: border-box; width: 100%; }
        
        .btn-add { background: var(--dark-red); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 3px 0 #550000; }
        .btn-clear { background: #666; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 3px 0 #333; }
        
        .chance-display { font-size: 16px; color: var(--dark-red); font-weight: bold; margin: 5px 0; text-align: center; }
        .chance-num { font-size: 32px; color: var(--red); }

        .wheel-container { position: relative; width: 260px; height: 260px; margin: 5px auto; flex-shrink: 0; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 40px solid #FFEA00; z-index: 100; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4)); }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--dark-red); transition: transform 5s cubic-bezier(0.15, 0, 0.2, 1); background: #fff; }

        .history-panel { margin: 10px 20px; border: 2px solid #EEE; border-radius: 10px; overflow: hidden; }
        .history-header { background: #F5F5F5; padding: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; color: #555; }
        .history-content { display: none; background: #FFF; padding: 10px; max-height: 120px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
        .history-badge { background: var(--red); color: white; border-radius: 10px; padding: 2px 8px; font-size: 12px; }

        .action-zone { padding: 0 20px 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-draw { width: 100%; padding: 12px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; }
        .single-draw { background: linear-gradient(to bottom, #f44336, #b71c1c); color: white; box-shadow: 0 4px 0 #7f0000; }
        .multi-draw { background: linear-gradient(to bottom, #FFD700, #FBC02D); color: #330000; box-shadow: 0 4px 0 #a08000; }
        .btn-checkout { background: #4CAF50 !important; color: white !important; box-shadow: 0 4px 0 #2E7D32 !important; }
        
        .admin-link { text-align: center; font-size: 12px; color: #BBB; margin-top: 10px; cursor: pointer; text-decoration: underline; }

        .result-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; color: white; padding: 15px; box-sizing: border-box; flex-direction: column; justify-content: center; align-items: center; }
        .result-card { background: var(--white); color: #333; width: 100%; max-width: 350px; border-radius: 15px; padding: 20px; text-align: center; }
        .final-item { font-size: 18px; font-weight: bold; color: var(--red); padding: 6px 0; border-bottom: 1px dashed #DDD; }
    </style>
</head>
<body>

<audio id="sndSpin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="sndWin" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3"></audio>
<audio id="sndBigWin" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<div class="container">
    <div id="storeTitle" class="header"><h1>🏮 好傢在年終慶 🏮</h1></div>

    <div class="prize-board">
        <div class="board-title">🏮 獎項看板 🏮</div>
        <div class="board-item"><span class="board-label">65吋電視</span></div>
        <div class="board-item"><span class="board-label">電動沙發</span></div>
        <div class="board-item"><span class="board-label">獨立筒床墊</span></div>
        <div class="board-item"><span class="board-label">石墨烯被胎</span></div>
        <div class="board-item"><span class="board-label">按摩眼罩</span></div>
        <div class="board-item"><span class="board-label">舒適毛毯</span></div>
    </div>

    <div class="admin-zone">
        <select id="storeSelect">
            <option value="">選擇門市...</option>
            <option value="苗栗店">苗栗店</option><option value="竹北店">竹北店</option>
            <option value="大甲店">大甲店</option><option value="西屯店">西屯店</option>
            <option value="崇德店">崇德店</option><option value="向上店">向上店</option>
            <option value="豐原店">豐原店</option><option value="埔里店">埔里店</option>
            <option value="虎尾店">虎尾店</option><option value="斗六店">斗六店</option>
            <option value="台東店">台東店</option><option value="澎湖店">澎湖店</option>
            <option value="金門店">金門店</option>
        </select>
        <div class="input-row">
            <input type="number" id="amtInput" placeholder="消費金額" inputmode="numeric">
            <input type="password" id="pwdInput" placeholder="門市密碼">
        </div>
        <div class="input-row">
            <button class="btn-add" style="flex: 2;" onclick="addChance()">存入次數</button>
            <button class="btn-clear" style="flex: 1;" onclick="resetForm()">清除內容</button>
        </div>
    </div>

    <div class="chance-display">剩餘次數 <span class="chance-num" id="chanceCount">0</span></div>

    <div class="wheel-container"><div class="pointer"></div><canvas id="wheelCanvas" width="300" height="300"></canvas></div>

    <div class="history-panel">
        <div class="history-header" onclick="toggleHistory()">
            <span>🎁 已獲獎清單</span>
            <span class="history-badge" id="historyCount">0</span>
        </div>
        <div class="history-content" id="historyList"></div>
    </div>

    <div class="action-zone">
        <button id="drawBtn" class="btn-draw single-draw" onclick="startSpin(false)" disabled>單次抽取</button>
        <button id="multiBtn" class="btn-draw multi-draw" onclick="startSpin(true)" disabled>全部抽取(梭哈)</button>
        <button id="checkoutBtn" class="btn-draw btn-checkout" onclick="showOverlay()" style="display:none;">核銷領獎</button>
        <div class="admin-link" onclick="sysMasterReset()">管理後台</div>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-card">
            <h2 style="color:var(--dark-red); margin:0 0 10px 0;">🏮 核銷領獎 🏮</h2>
            <div id="finalPrizeList" style="margin-bottom: 15px; max-height: 150px; overflow-y: auto;"></div>
            <input type="text" id="posNoInput" style="border:2px solid #4CAF50; text-align:center; padding:10px; width:100%; border-radius:8px; margin-bottom:10px;" placeholder="POS 單號">
            <input type="password" id="staffPwd" placeholder="請輸入核銷密碼" style="width:100%; padding:10px; margin-bottom:10px; text-align:center; border:2px solid #D32F2F; border-radius:8px;">
            <button id="verifyBtn" onclick="finalVerify()" style="background:var(--dark-red); color:white; padding:15px; width:100%; border-radius:8px; border:none; font-weight:bold;">✅ 確認送出</button>
            <button onclick="document.getElementById('resultOverlay').style.display='none'" style="background:none; border:none; color:#888; margin-top:10px; text-decoration:underline;">返回</button>
        </div>
    </div>
</div>

<script>
    const STAFF_PASSWORD = "888";
    const MASTER_PASSWORD = "0915";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyYDmtrRvKBVW-JM4v_ivN3IWZIJLg1E9BkjHVlELm5QpZVPYDHqv5TdbYZpJIjiIB7GQ/exec";

    const initialPrizes = [
        { id: 0, n: "獨立筒床墊", w: 5, qty: 15, c: "#D32F2F", big: true },
        { id: 1, n: "65吋電視", w: 1, qty: 2, c: "#FFD700", big: true },
        { id: 2, n: "電動沙發", w: 2, qty: 4, c: "#D32F2F", big: true },
        { id: 3, n: "石墨烯被胎", w: 10, qty: 30, c: "#FFD700" },
        { id: 4, n: "熱敷按摩眼罩", w: 10, qty: 30, c: "#D32F2F" },
        { id: 5, n: "5cm記憶床墊", w: 10, qty: 20, c: "#FFD700" },
        { id: 6, n: "舒適毛毯", w: 1000, qty: 500, c: "#D32F2F" },
        { id: 7, n: "壓縮毛巾", w: 8962, qty: 10000, c: "#D32F2F" }
    ];

    let prizes = JSON.parse(localStorage.getItem('hjz_prizes')) || JSON.parse(JSON.stringify(initialPrizes));
    let chances = parseInt(localStorage.getItem('hjz_chances')) || 0;
    let accumulatedPrizes = JSON.parse(localStorage.getItem('hjz_accumulated')) || [];
    let currentStore = localStorage.getItem('hjz_store') || ""; 
    let currentAmount = localStorage.getItem('hjz_last_amt') || 0; 
    let isSpinning = false, currentRotation = 0;
    const canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d');

    function initUI() {
        if (currentStore) {
            document.getElementById('storeSelect').value = currentStore;
            document.getElementById('storeTitle').innerHTML = `<h1>🏮 好傢在${currentStore} 🏮</h1>`;
        }
        updateUI(); drawWheel(); updateHistoryUI();
    }

    // 🚀 更新後的清除功能：輸入 888 點擊清除，可連同剩餘次數一起歸零
    function resetForm() {
        const p = document.getElementById('pwdInput').value;
        if (p === STAFF_PASSWORD) {
            if (confirm("確定要清除所有剩餘抽獎次數嗎？")) {
                chances = 0;
                localStorage.setItem('hjz_chances', 0);
                document.getElementById('amtInput').value = "";
                document.getElementById('pwdInput').value = "";
                updateUI();
                alert("輸入內容與剩餘次數已成功歸零");
            }
        } else {
            document.getElementById('amtInput').value = "";
            document.getElementById('pwdInput').value = "";
            alert("輸入內容已清除 (如需歸零剩餘次數，請先輸入門市密碼)");
        }
    }

    function sysMasterReset() {
        const p = prompt("請輸入管理後台密碼：");
        if (p === MASTER_PASSWORD) {
            if (confirm("【管理者提醒】這將恢復初始庫存量並清空所有測試紀錄。確定嗎？")) {
                localStorage.clear();
                location.reload();
            }
        } else if (p !== null) {
            alert("密碼錯誤！");
        }
    }

    function toggleHistory() {
        const content = document.getElementById('historyList');
        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    function updateHistoryUI() {
        const listDiv = document.getElementById('historyList');
        const countBadge = document.getElementById('historyCount');
        countBadge.innerText = accumulatedPrizes.length;
        if (accumulatedPrizes.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center; color:#AAA; padding:10px;">尚未抽獎</div>';
            return;
        }
        const counts = {};
        accumulatedPrizes.forEach(p => counts[p] = (counts[p] || 0) + 1);
        listDiv.innerHTML = Object.entries(counts).map(([n, v]) => `<div class="history-item"><span>${n}</span><span style="font-weight:bold; color:var(--red);">x ${v}</span></div>`).join('');
    }

    function drawWheel() {
        const arc = (2 * Math.PI) / prizes.length;
        ctx.clearRect(0, 0, 300, 300);
        prizes.forEach((p, i) => {
            const startAngle = i * arc - Math.PI / 2;
            const endAngle = (i + 1) * arc - Math.PI / 2;
            ctx.fillStyle = p.c;
            ctx.beginPath(); ctx.moveTo(150, 150); ctx.arc(150, 150, 145, startAngle, endAngle); ctx.fill();
            ctx.save(); ctx.translate(150, 150); ctx.rotate(startAngle + arc / 2);
            ctx.fillStyle = p.c === "#FFD700" ? "#333" : "#FFF";
            ctx.font = "bold 14px Microsoft JhengHei"; ctx.textAlign = "right";
            ctx.fillText(p.n, 130, 5); ctx.restore();
        });
    }

    function startSpin(isMulti) {
        if (chances <= 0 || isSpinning) return;
        const getAvailableTotalW = () => prizes.reduce((s, p) => (p.qty > 0 ? s + p.w : s), 0);
        let totalW = getAvailableTotalW();
        if (totalW <= 0) return alert("獎項已全數領完！");
        isSpinning = true; updateUI();
        const sndSpin = document.getElementById('sndSpin');
        sndSpin.currentTime = 0; sndSpin.play().catch(()=>{});
        const count = isMulti ? chances : 1;
        let lastWinIdx = 7; 
        let hasBigWin = false;
        for(let j=0; j<count; j++) {
            let currentTotalW = getAvailableTotalW();
            let r = Math.random() * currentTotalW;
            let winIdx = 7;
            for(let i=0; i<prizes.length; i++) { 
                if (prizes[i].qty > 0) {
                    if(r < prizes[i].w) { winIdx = i; break; } 
                    r -= prizes[i].w; 
                }
            }
            prizes[winIdx].qty--;
            accumulatedPrizes.push(prizes[winIdx].n);
            if(prizes[winIdx].big) hasBigWin = true;
            lastWinIdx = winIdx;
        }
        const arcDeg = 360 / prizes.length;
        const targetRotation = (360 - (lastWinIdx * arcDeg)) - (arcDeg / 2);
        currentRotation += (3600 + targetRotation - (currentRotation % 360));
        canvas.style.transform = `rotate(${currentRotation}deg)`;
        setTimeout(() => {
            isSpinning = false; 
            chances -= count;
            localStorage.setItem('hjz_chances', chances);
            localStorage.setItem('hjz_accumulated', JSON.stringify(accumulatedPrizes));
            localStorage.setItem('hjz_prizes', JSON.stringify(prizes));
            sndSpin.pause();
            if(hasBigWin) document.getElementById('sndBigWin').play().catch(()=>{});
            else document.getElementById('sndWin').play().catch(()=>{});
            updateHistoryUI(); updateUI();
            if (chances === 0) showOverlay();
        }, isMulti ? 500 : 5000);
    }

    function addChance() {
        const s = document.getElementById('storeSelect').value;
        const a = document.getElementById('amtInput').value;
        const p = document.getElementById('pwdInput').value;
        if (!s || !a || a < 2000 || p !== STAFF_PASSWORD) return alert("資訊錯誤或密碼不正確");
        currentStore = s; currentAmount = a;
        localStorage.setItem('hjz_store', s); localStorage.setItem('hjz_last_amt', a);
        chances += Math.floor(a / 2000);
        localStorage.setItem('hjz_chances', chances);
        document.getElementById('pwdInput').value = "";
        updateUI();
    }

    function showOverlay() {
        document.getElementById('resultOverlay').style.display = 'flex';
        const finalDiv = document.getElementById('finalPrizeList');
        const counts = {};
        accumulatedPrizes.forEach(p => counts[p] = (counts[p] || 0) + 1);
        finalDiv.innerHTML = Object.entries(counts).map(([n, v]) => `<div class="final-item">${n} x ${v}</div>`).join('');
    }

    async function finalVerify() {
        const posNo = document.getElementById('posNoInput').value;
        const pwd = document.getElementById('staffPwd').value;
        if (!posNo || pwd !== STAFF_PASSWORD) return alert("單號或密碼錯誤");
        const vBtn = document.getElementById('verifyBtn');
        vBtn.innerText = "同步中..."; vBtn.disabled = true;
        const counts = {};
        accumulatedPrizes.forEach(p => counts[p] = (counts[p] || 0) + 1);
        const detailStr = Object.entries(counts).map(([n, v]) => `${n}x${v}`).join(', ');
        try {
            await fetch(GAS_URL, {
                method: "POST", mode: 'no-cors',
                body: JSON.stringify({
                    t: new Date().toLocaleString(), s: currentStore, p: detailStr, a: currentAmount, pos: "'" + posNo
                })
            });
        } catch (e) {}
        accumulatedPrizes = [];
        localStorage.removeItem('hjz_accumulated');
        vBtn.innerText = "✅ 核銷成功";
        setTimeout(() => { location.reload(); }, 1200);
    }

    function updateUI() { 
        document.getElementById('chanceCount').innerText = chances;
        document.getElementById('drawBtn').disabled = document.getElementById('multiBtn').disabled = (chances <= 0 || isSpinning);
        document.getElementById('checkoutBtn').style.display = (accumulatedPrizes.length > 0 && !isSpinning) ? "block" : "none";
    }
    initUI();
</script>
</body>
</html>
