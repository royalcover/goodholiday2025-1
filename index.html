<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好傢在年終慶 | 抽獎系統</title>
    <style>
        :root { --red: #D32F2F; --dark-red: #8B0000; --gold: #FFD700; --light-gold: #FFF9C4; --white: #FFFFFF; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: radial-gradient(circle at center, #b71c1c 0%, #310000 100%); margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; background: var(--white); border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); overflow: hidden; border: 4px solid var(--gold); display: flex; flex-direction: column; position: relative; }
        .header { background: var(--dark-red); color: var(--gold); padding: 12px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
        .admin-zone { background: var(--light-gold); padding: 12px; margin: 10px; border-radius: 12px; border: 1px solid #e0c060; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; margin-bottom: 10px; }
        select, input { border: 2px solid #ccc; border-radius: 8px; padding: 10px; font-size: 14px; outline: none; background: white; box-sizing: border-box; width: 100%; }
        .btn-add { width: 100%; background: var(--dark-red); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 #550000; }
        .btn-reset { width: 100%; background: none; border: none; color: #888; text-decoration: underline; font-size: 13px; margin-top: 10px; cursor: pointer; }
        .promo-rule { background: #FFFDE7; border: 2px dashed #FFB300; padding: 8px; margin: 10px 20px 0; border-radius: 10px; text-align: center; color: var(--dark-red); font-weight: bold; font-size: 15px; }
        .chance-display { font-size: 16px; color: var(--dark-red); font-weight: bold; margin: 5px 0; text-align: center; }
        .chance-num { font-size: 32px; color: var(--red); }
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 10px auto; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 40px solid #FFEA00; z-index: 100; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.4)); }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--dark-red); transition: transform 5s cubic-bezier(0.15, 0, 0.2, 1); background: #fff; }
        .live-result { margin: 10px 20px; padding: 15px; background: #FFF9C4; border-radius: 10px; border: 2px solid var(--gold); text-align: center; }
        .current-prize-text { color: var(--dark-red); font-weight: bold; font-size: 20px; display: block; }
        .action-zone { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-draw { width: 100%; padding: 15px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; }
        .single-draw { background: linear-gradient(to bottom, #f44336, #b71c1c); color: white; box-shadow: 0 5px 0 #7f0000; }
        .multi-draw { background: linear-gradient(to bottom, #FFD700, #FBC02D); color: #330000; box-shadow: 0 5px 0 #a08000; }
        .btn-draw:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-draw:disabled { background: #dcdcdc !important; color: #888 !important; box-shadow: none !important; }
        
        /* 強制核銷遮罩 */
        .result-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.98); 
            z-index: 9999; 
            color: white; 
            padding: 20px; 
            box-sizing: border-box; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            pointer-events: auto;
        }
        .result-card { background: var(--white); color: #333; width: 100%; max-width: 350px; border-radius: 15px; padding: 20px; text-align: center; }
        .summary-item { font-size: 18px; margin: 8px 0; color: var(--dark-red); border-bottom: 1px solid #eee; padding-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="storeTitle" class="header"><h1>🏮 好傢在年終慶 🏮</h1></div>

    <div class="admin-zone">
        <select id="storeSelect">
            <option value="">請選擇門市...</option>
            <option value="苗栗店">苗栗店</option><option value="竹北店">竹北店</option>
            <option value="大甲店">大甲店</option><option value="西屯店">西屯店</option>
            <option value="崇德店">崇德店</option><option value="向上店">向上店</option>
            <option value="豐原店">豐原店</option><option value="埔里店">埔里店</option>
            <option value="虎尾店">虎尾店</option><option value="斗六店">斗六店</option>
            <option value="台東店">台東店</option><option value="澎湖店">澎湖店</option>
            <option value="金門店">金門店</option>
        </select>
        <div class="input-row">
            <input type="number" id="amtInput" placeholder="消費金額">
            <input type="password" id="pwdInput" placeholder="管理密碼">
        </div>
        <button class="btn-add" onclick="addChance()">儲存抽獎次數</button>
        <button class="btn-reset" onclick="resetChances()">金額輸入錯誤？點此重設次數</button>
    </div>

    <div class="promo-rule">🎊 當日單筆消費滿兩千可抽獎一次 🎊</div>
    <div class="chance-display">剩餘抽獎次數 <span class="chance-num" id="chanceCount">0</span></div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <div class="live-result" id="liveResult">
        <span class="current-prize-text" id="livePrize">點擊下方開始</span>
    </div>

    <div class="action-zone">
        <button id="drawBtn" class="btn-draw single-draw" onclick="startSpin(false)" disabled>單次抽取</button>
        <button id="multiBtn" class="btn-draw multi-draw" onclick="startSpin(true)" disabled>全部抽取 (梭哈)</button>
    </div>

    <div id="resultOverlay" class="result-overlay">
        <div class="result-card">
            <h2 style="color:var(--dark-red); margin-bottom: 5px;">🎊 待核銷獎項 🎊</h2>
            <p style="font-size: 14px; color: #666;">請店員確認明細並核銷</p>
            <div id="prizeDetails" style="max-height: 200px; overflow-y: auto; margin: 15px 0; font-weight: bold; border: 1px solid #eee; border-radius: 8px; padding: 10px;"></div>
            
            <button onclick="copyToClipboard()" style="background:#4CAF50; color:white; border:none; padding:12px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom: 15px;">📋 複製明細貼至 POS</button>
            
            <div style="border-top:2px dashed #ccc; padding-top:15px;">
                <input type="password" id="staffPwd" placeholder="請輸入核銷密碼" style="width:100%; padding:12px; margin-bottom:10px; box-sizing: border-box; border: 2px solid var(--dark-red); border-radius: 8px;">
                <button id="verifyBtn" onclick="finalVerify()" style="background:var(--dark-red); color:white; padding:15px; width:100%; border-radius:8px; border:none; font-weight:bold; font-size: 18px; cursor:pointer;">✅ 確認核銷並同步雲端</button>
            </div>
            <p style="font-size: 12px; color: #999; margin-top: 10px;">(核銷完成前畫面將鎖定)</p>
        </div>
    </div>
</div>

<script>
    const STAFF_PASSWORD = "888";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyYDmtrRvKBVW-JM4v_ivN3IWZIJLg1E9BkjHVlELm5QpZVPYDHqv5TdbYZpJIjiIB7GQ/exec";

    // 獎項權重：大幅調低大獎機率
    const prizes = [
        { n: "獨立筒床墊", w: 0.1, c: "#D32F2F" },     
        { n: "65吋電視", w: 0.1, c: "#FFD700" },       
        { n: "電動沙發", w: 0.1, c: "#D32F2F" },       
        { n: "石墨烯被胎", w: 1, c: "#FFD700" },     
        { n: "熱敷按摩眼罩", w: 2, c: "#D32F2F" },   
        { n: "5cm記憶床墊", w: 0.5, c: "#FFD700" },     
        { n: "舒適毛毯", w: 5, c: "#D32F2F" },      
        { n: "壓縮毛巾", w: 991.2, c: "#D32F2F" }      
    ];

    let chances = parseInt(localStorage.getItem('hjz_chances')) || 0;
    let accumulatedPrizes = JSON.parse(localStorage.getItem('hjz_accumulated')) || [];
    let currentStore = localStorage.getItem('hjz_store') || ""; 
    let currentAmount = localStorage.getItem('hjz_last_amt') || 0; 
    let isSpinning = false, currentRotation = 0;
    const canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d');

    function initUI() {
        if (currentStore) {
            document.getElementById('storeSelect').value = currentStore;
            document.getElementById('storeTitle').innerHTML = `<h1>🏮 好傢在${currentStore} 🏮</h1>`;
        }
        
        // 強制檢查是否有未核銷獎項
        const savedPrizes = localStorage.getItem('hjz_accumulated');
        if (savedPrizes && JSON.parse(savedPrizes).length > 0) {
            accumulatedPrizes = JSON.parse(savedPrizes);
            showOverlay();
        }

        updateUI();
        drawWheel();
    }

    function drawWheel() {
        const arc = (2 * Math.PI) / prizes.length;
        ctx.clearRect(0, 0, 300, 300);
        prizes.forEach((p, i) => {
            const startAngle = i * arc - Math.PI / 2;
            const endAngle = (i + 1) * arc - Math.PI / 2;
            ctx.fillStyle = p.c;
            ctx.beginPath(); ctx.moveTo(150, 150); ctx.arc(150, 150, 145, startAngle, endAngle); ctx.fill();
            ctx.save(); ctx.translate(150, 150); ctx.rotate(startAngle + arc / 2);
            ctx.fillStyle = p.c === "#FFD700" ? "#333" : "#FFF";
            ctx.font = "bold 14px Microsoft JhengHei"; ctx.textAlign = "right";
            ctx.fillText(p.n, 130, 5); ctx.restore();
        });
    }

    function addChance() {
        const s = document.getElementById('storeSelect').value;
        const a = document.getElementById('amtInput').value;
        if (!s || document.getElementById('pwdInput').value !== STAFF_PASSWORD) return alert("密碼錯誤或門市未選");
        
        currentStore = s;
        currentAmount = a; 
        localStorage.setItem('hjz_store', s); 
        localStorage.setItem('hjz_last_amt', a);
        document.getElementById('storeTitle').innerHTML = `<h1>🏮 好傢在${s} 🏮</h1>`;
        
        chances += Math.floor(a / 2000);
        updateUI(); 
        localStorage.setItem('hjz_chances', chances);
        alert(`已存入 ${Math.floor(a / 2000)} 次機會！`);
    }

    function resetChances() {
        if (document.getElementById('pwdInput').value !== STAFF_PASSWORD) return alert("請輸入管理密碼以重設");
        if (confirm("確定要將剩餘次數歸零重新輸入嗎？")) {
            chances = 0;
            localStorage.setItem('hjz_chances', 0);
            updateUI();
            alert("次數已重設。");
        }
    }

    function startSpin(isMulti) {
        if (chances <= 0 || isSpinning) return;
        isSpinning = true; updateUI();
        let sessionResults = [];
        const count = isMulti ? chances : 1;
        const totalW = prizes.reduce((s, p) => s + p.w, 0);

        let finalWinIdx = 0;
        for(let j=0; j<count; j++) {
            let r = Math.random() * totalW;
            let currentWinIdx = 0;
            for(let i=0; i<prizes.length; i++) { if(r < prizes[i].w) { currentWinIdx = i; break; } r -= prizes[i].w; }
            sessionResults.push(prizes[currentWinIdx].n);
            accumulatedPrizes.push(prizes[currentWinIdx].n);
            if(j === count - 1) finalWinIdx = currentWinIdx; 
        }

        const arcDeg = 360 / prizes.length;
        const targetRotation = (360 - (finalWinIdx * arcDeg)) - (arcDeg / 2);
        currentRotation += (3600 + targetRotation - (currentRotation % 360));
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false; 
            chances -= count; 
            updateUI();
            localStorage.setItem('hjz_chances', chances);
            localStorage.setItem('hjz_accumulated', JSON.stringify(accumulatedPrizes));
            showOverlay();
        }, isMulti ? 500 : 5000);
    }

    function showOverlay() {
        document.getElementById('resultOverlay').style.display = 'flex';
        const details = document.getElementById('prizeDetails');
        const counts = {};
        accumulatedPrizes.forEach(p => counts[p] = (counts[p] || 0) + 1);
        details.innerHTML = Object.entries(counts).map(([n, v]) => `<div class="summary-item">${n} x ${v}</div>`).join('');
    }

    async function finalVerify() {
        if (document.getElementById('staffPwd').value !== STAFF_PASSWORD) return alert("核銷密碼錯誤！");
        
        const vBtn = document.getElementById('verifyBtn');
        vBtn.innerText = "傳輸中...";
        vBtn.disabled = true;

        const counts = {};
        accumulatedPrizes.forEach(p => counts[p] = (counts[p] || 0) + 1);
        const detailStr = Object.entries(counts).map(([n, v]) => `${n}x${v}`).join(', ');
        const verifyId = "HJ-" + Date.now().toString().slice(-6);

        try {
            await fetch(GAS_URL, {
                method: "POST",
                mode: 'no-cors',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    t: new Date().toLocaleString('zh-TW', { hour12: false }),
                    s: currentStore,
                    p: detailStr,
                    a: currentAmount,
                    id: verifyId
                })
            });
        } catch (e) { console.error(e); }

        accumulatedPrizes = [];
        localStorage.removeItem('hjz_accumulated');
        localStorage.removeItem('hjz_last_amt');
        document.getElementById('staffPwd').value = ""; 
        
        vBtn.innerText = "✅ 確認核銷並同步雲端";
        vBtn.disabled = false;
        document.getElementById('resultOverlay').style.display = 'none';
        alert("核銷完成，資料已同步至雲端表格！");
        updateUI();
    }

    function copyToClipboard() {
        const counts = {};
        accumulatedPrizes.forEach(p => counts[p] = (counts[p] || 0) + 1);
        const detailStr = Object.entries(counts).map(([n, v]) => `${n} x ${v}`).join('\n');
        const text = `【好傢在抽獎紀錄】\n門市:${currentStore}\n核銷ID:${Date.now().toString().slice(-6)}\n明細:\n${detailStr}`;
        navigator.clipboard.writeText(text).then(() => alert("明細已複製"));
    }

    function updateUI() { 
        document.getElementById('chanceCount').innerText = chances;
        document.getElementById('drawBtn').disabled = document.getElementById('multiBtn').disabled = (chances <= 0 || isSpinning);
        document.getElementById('livePrize').innerText = chances > 0 ? "點擊下方開始" : (accumulatedPrizes.length > 0 ? "等待核銷中" : "次數已用完");
    }

    initUI();
</script>
</body>
</html>
