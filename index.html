<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏮 好傢在年終慶 🏮</title>
    <style>
        :root { 
            --gold: #ffdf00; --red: #e60000; --dark-red: #8b0000; --accent: #ffefba;
            --lamp-on: #fff; --lamp-off: #ffdf00;
        }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background: radial-gradient(circle, #a00000 0%, #330000 100%);
            display: flex; justify-content: center; padding: 10px; min-height: 100vh; margin: 0;
        }
        .container { 
            width: 100%; max-width: 450px; background: #fff; padding: 25px; 
            border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
            text-align: center; border: 6px solid var(--gold); align-self: center;
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
        }
        h1 { color: var(--red); text-shadow: 2px 2px #ffefba; margin: 0; font-size: 30px; letter-spacing: 2px; }
        .promo-tag { 
            background: var(--red); color: #fff; display: inline-block; 
            padding: 5px 15px; border-radius: 20px; font-weight: bold; 
            margin: 10px 0; font-size: 18px; border: 2px solid var(--gold);
        }
        .admin-section { background: #fff8e1; padding: 12px; border-radius: 15px; margin-bottom: 15px; border: 2px dashed var(--red); }
        input { width: 90px; padding: 10px; border-radius: 8px; border: 2px solid #ddd; font-size: 16px; }
        button.admin-btn { background: var(--dark-red); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* 轉盤外圈與閃爍燈 */
        .wheel-container { position: relative; width: 320px; height: 320px; margin: 15px auto; }
        .wheel-outer {
            width: 100%; height: 100%; border-radius: 50%; background: #b30000;
            box-shadow: 0 0 30px var(--gold); display: flex; align-items: center; justify-content: center;
            position: relative; border: 8px solid #8b0000;
        }
        .lights { position: absolute; width: 100%; height: 100%; border-radius: 50%; animation: flash 0.8s infinite; z-index: 2; }
        @keyframes flash {
            0% { border: 6px dotted var(--lamp-on); }
            50% { border: 6px dotted var(--lamp-off); }
            100% { border: 6px dotted var(--lamp-on); }
        }
        #wheelCanvas { border-radius: 50%; transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); z-index: 5; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 40px solid var(--gold); z-index: 20; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5)); }

        .draw-btn { width: 100%; padding: 18px; font-size: 24px; font-weight: bold; color: #fff; background: linear-gradient(to bottom, #ff4747, #b30000); border: none; border-radius: 50px; cursor: pointer; margin-top: 15px; box-shadow: 0 8px 0 #660000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .draw-btn:disabled { background: #999; box-shadow: none; transform: translateY(8px); animation: none; }

        .result-display { display: none; margin-top: 20px; padding: 15px; border: 4px solid var(--gold); border-radius: 20px; background: var(--dark-red); color: white; }
        .prize-text { font-size: 32px; font-weight: bold; color: var(--gold); margin: 10px 0; text-shadow: 2px 2px #000; }
        .verify-btn { background: var(--gold); color: #000; padding: 12px 25px; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .stamp { font-size: 45px; color: #1ed760; font-weight: bold; transform: rotate(-15deg); border: 6px solid #1ed760; display: inline-block; padding: 5px 20px; margin: 10px; background: rgba(0,0,0,0.2); }
        .timer-box { font-family: monospace; color: #1ed760; background: #000; padding: 8px; border-radius: 5px; font-size: 14px; margin-top: 10px; border: 1px solid #333; }
        .report-title { font-size: 12px; color: #999; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>好傢在年終慶活動</h1>
    <div class="promo-tag">✨ 消費滿 2000 元抽一次 ✨</div>
    
    <div class="admin-section">
        <input type="number" id="amtInput" placeholder="消費金額">
        <button class="admin-btn" onclick="addChance()">設定點數</button>
    </div>

    <div style="font-size: 24px; color: var(--red); font-weight: 900; margin: 5px 0;">
        您的抽獎機會：<span id="chanceCount">0</span> 次
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel-outer">
            <div class="lights"></div>
            <canvas id="wheelCanvas" width="280" height="280"></canvas>
        </div>
    </div>

    <button id="drawBtn" class="draw-btn" onclick="startSpin()" disabled>開始年終抽獎</button>

    <div id="resultBox" class="result-display"></div>

    <div style="margin-top: 15px; color: #555; font-size: 12px; font-weight: bold;">
        ※ 核銷後請由工作人員確認「已兌換」章<br>
        <span style="color:red;">※ 即時動態秒數驗證，截圖無效</span>
    </div>

    <div class="report-title" onclick="toggleReport()">[ 管理員報表功能 ]</div>
    <div id="reportContent" style="display:none; text-align: left; background: #eee; padding: 10px; border-radius: 10px; margin-top: 10px;">
        <pre id="logData" style="font-size: 12px; white-space: pre-wrap;"></pre>
        <button onclick="copyLog()" style="width:100%; padding: 8px;">複製清單傳回總公司</button>
        <button onclick="clearLog()" style="width:100%; padding: 8px; color: red; margin-top: 5px;">清空今日紀錄</button>
    </div>
</div>

<script>
    const prizes = [
        { n: "獨立筒床墊", w: 15, c1: "#e60000", c2: "#fff" },
        { n: "65吋電視", w: 2, c1: "#ffdf00", c2: "#333" },
        { n: "電動沙發", w: 4, c1: "#e60000", c2: "#fff" },
        { n: "石墨烯被胎", w: 30, c1: "#ffdf00", c2: "#333" },
        { n: "按摩小家電", w: 30, c1: "#e60000", c2: "#fff" },
        { n: "5cm記憶床墊", w: 20, c1: "#ffdf00", c2: "#333" },
        { n: "舒適毛毯", w: 500, c1: "#e60000", c2: "#fff" },
        { n: "濕紙巾", w: 10000, c1: "#ffdf00", c2: "#333" }
    ];

    let chances = 0, isSpinning = false, currentRotation = 0, currentWinPrize = "";
    let amountQueue = []; // 新增：金額排隊系統，解決金額亂跳問題

    const canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d'), centerX = 140, centerY = 140;

    function drawWheel() {
        const arc = (2 * Math.PI) / prizes.length;
        prizes.forEach((p, i) => {
            const angle = i * arc;
            ctx.fillStyle = p.c1;
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, 140, angle, angle + arc); ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.stroke();
            ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(angle + arc / 2); ctx.textAlign = "right"; ctx.fillStyle = p.c2;
            ctx.font = "bold 13px Microsoft JhengHei"; ctx.fillText(p.n, 125, 6); ctx.restore();
        });
    }
    drawWheel();

    setInterval(() => {
        const clock = document.getElementById('liveClock');
        if (clock) {
            const now = new Date();
            clock.innerText = now.toLocaleString() + "." + Math.floor(now.getMilliseconds()/100) + " [LIVE]";
        }
    }, 100);

    function addChance() {
        const val = parseInt(document.getElementById('amtInput').value);
        if (!val || val < 2000) return alert("金額不足 2000 元！");
        const count = Math.floor(val / 2000);
        chances += count;
        
        // 重要修正：將金額存入佇列中，與次數對應
        for(let i=0; i<count; i++) {
            amountQueue.push(val);
        }
        
        document.getElementById('amtInput').value = "";
        updateUI();
        alert(`🧧 年終大酬賓！成功增加 ${count} 次機會！`);
    }

    function startSpin() {
        if (chances <= 0 || isSpinning) return;
        isSpinning = true; document.getElementById('drawBtn').disabled = true; document.getElementById('resultBox').style.display = 'none';
        const totalW = prizes.reduce((s, p) => s + p.w, 0);
        let random = Math.random() * totalW, winIdx = 0;
        for (let i = 0; i < prizes.length; i++) { if (random < prizes[i].w) { winIdx = i; break; } random -= prizes[i].w; }
        currentWinPrize = prizes[winIdx].n;
        const segmentDeg = 360 / prizes.length;
        const stopAngle = 360 - (winIdx * segmentDeg) - 90 - (segmentDeg / 2);
        currentRotation += 1800 + (stopAngle - (currentRotation % 360));
        canvas.style.transform = `rotate(${currentRotation}deg)`;
        setTimeout(() => { 
            isSpinning = false; 
            chances--; 
            // 抽獎完後取出對應的金額紀錄
            const thisAmount = amountQueue.shift(); 
            updateUI(); 
            showResult(currentWinPrize, thisAmount); 
        }, 4000);
    }

    function showResult(prizeName, amount) {
        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'block';
        resBox.innerHTML = `
            <div style="font-size: 20px; color: var(--gold); font-weight: bold;">🧧 恭喜抽中 🧧</div>
            <div class="prize-text">${prizeName}</div>
            <div id="verifyArea"><button class="verify-btn" onclick="confirmVerify('${prizeName}', ${amount})">店員現場核銷</button></div>
            <div id="liveClock" class="timer-box"></div>
        `;
    }

    function confirmVerify(prize, amount) {
        if (confirm("店員確認：確定發放贈品？")) {
            let logs = JSON.parse(localStorage.getItem('lucky_logs_final') || "[]");
            logs.push({ t: new Date().toLocaleTimeString(), p: prize, a: amount });
            localStorage.setItem('lucky_logs_final', JSON.stringify(logs));
            document.getElementById('verifyArea').innerHTML = '<div class="stamp">已兌換</div>';
        }
    }

    function renderLog() {
        let logs = JSON.parse(localStorage.getItem('lucky_logs_final') || "[]");
        document.getElementById('logData').innerText = logs.length ? logs.map(l => `[${l.t}] ${l.p} (額:${l.a})`).join('\n') : "尚未有紀錄";
    }

    function copyLog() { navigator.clipboard.writeText("好傢在報表：\n" + document.getElementById('logData').innerText).then(() => alert("已複製！")); }
    function clearLog() { if(confirm("確定清空？")) { localStorage.removeItem('lucky_logs_final'); renderLog(); } }
    function toggleReport() { const content = document.getElementById('reportContent'); content.style.display = content.style.display === 'none' ? 'block' : 'none'; renderLog(); }
    function updateUI() { document.getElementById('chanceCount').innerText = chances; document.getElementById('drawBtn').disabled = (chances <= 0 || isSpinning); }
</script>
</body>
</html>
